            </ul>
            <ul class="terzapersona">

                </li>

        <!--     -->
        <div class="video-background">
            <iframe 
                width="1790" 
                height="799" 
                src="https://www.youtube.com/embed/-pEkkQ1ITRk?autoplay=1&mute=1&loop=1&playlist=-pEkkQ1ITRk&controls=0&showinfo=0&modestbranding=1"

                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>

        </div>
        <div class="audio-controls">
            <!-- Play/Pause Button -->
            <button class="audio-button" id="play-pause-button">
                <span class="material-icons" id="play-pause-icon">play_arrow</span>
            </button>
        
            <!-- Progress Bar -->
            <div class="progress-container">
                <input type="range" id="progress-bar" min="0" max="100" value="0" />
            </div>
        
            <!-- Volume Button with Slider -->
            <div class="volume-container">
                <div class="volume-box">
                    <!-- Pulsante invisibile -->
                    <div class="volume-button" id="volume-button">
                        <span class="material-icons">volume_up</span>
                    </div>
                
                    <!-- Slider del volume -->
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" />
                </div>
            </div>
        </div>
        
        <audio id="audio-player" src="music/song.mp3" loop></audio>


        <div class="social-buttons">
            <button class="social-button discord" data-url="https://discord.gg/Ur9kE8qmNX">
